<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yu-gi-oooooooh! - roleta da infância</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome para Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- JS Confetti para efeito de celebração -->
    <script src="https://cdn.jsdelivr.net/npm/js-confetti@latest/dist/js-confetti.browser.js"></script>
    <!-- Google Fonts: Orbitron e Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Orbitron:wght@700;900&display=swap" rel="stylesheet">
    
    <script src="tailwind.config.js"></script>
    
    <link rel="stylesheet" href="styles.css">
</head>
<body class="flex flex-col justify-between font-sans antialiased">

    <!-- Header Section -->
    <header class="w-full py-6 px-4 text-center border-b border-slate-800 bg-slate-900/60 backdrop-blur-md sticky top-0 z-30">
        <div class="max-w-6xl mx-mx-auto flex flex-col md:flex-row items-center justify-between gap-4 px-4">
            <div class="flex items-center gap-3">
                <h1 class="font-display font-black text-2xl md:text-3xl tracking-wider text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-amber-400 to-rose-500 uppercase">
                    Yu-gi-oooooooh!
                </h1>
            </div>
            
            <!-- Selector Tabs for Mobile / View Modes -->
            <div class="flex bg-slate-800/80 p-1 rounded-xl border border-slate-700/50">
                <button id="tab-all" onclick="switchTab('all')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 bg-amber-500 text-slate-950 shadow-md">
                    <i class="fa-solid fa-columns mr-1"></i> Ambas
                </button>
                <button id="tab-prizes" onclick="switchTab('prizes')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-trophy mr-1"></i> Prêmios
                </button>
                <button id="tab-accidents" onclick="switchTab('accidents')" class="px-4 py-2 rounded-lg text-sm font-semibold transition-all duration-200 text-slate-400 hover:text-white">
                    <i class="fa-solid fa-skull-crossbones mr-1"></i> Acidentes
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-8">
        
        <div id="wheels-grid" class="grid grid-cols-1 lg:grid-cols-2 gap-8 lg:gap-12 items-start">

            <!-- ROLETA 1: PRÊMIOS -->
            <section id="section-prizes" class="flex flex-col items-center bg-slate-900/40 border border-amber-500/20 rounded-2xl p-6 md:p-8 backdrop-blur-sm transition-all">
                <div class="flex items-center gap-2 mb-4">
                    <span class="p-2 bg-amber-500/10 rounded-lg text-amber-400">
                        <i class="fa-solid fa-trophy text-2xl"></i>
                    </span>
                    <h2 class="font-display text-2xl font-bold tracking-wide text-amber-400 uppercase">
                        Prêmios
                    </h2>
                </div>

                <!-- Canvas da Roleta 1 -->
                <div class="wheel-container mb-6">
                    <div class="wheel-pointer"></div>
                    <canvas id="canvas-prizes" width="380" height="380" class="max-w-full h-auto cursor-pointer"></canvas>
                </div>

                <!-- Botão de Giro -->
                <button id="btn-spin-prizes" onclick="spinWheel('prizes')" class="glow-button-prizes w-full max-w-xs py-4 px-6 bg-gradient-to-r from-amber-500 to-amber-600 hover:from-amber-400 hover:to-amber-500 text-slate-950 font-display font-black text-lg tracking-wider uppercase rounded-xl transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-spin text-xl"></i> Girar Prêmios
                </button>

                <!-- Lista de Itens da Roleta -->
                <div class="w-full mt-8 border-t border-slate-800 pt-6">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Opções da Roleta:</h3>
                    <ul id="list-prizes" class="space-y-2 text-sm text-slate-300">
                        <!-- Preenchido dinamicamente pelo JS -->
                    </ul>
                </div>
            </section>

            <!-- ROLETA 2: ACIDENTES -->
            <section id="section-accidents" class="flex flex-col items-center bg-slate-900/40 border border-rose-500/20 rounded-2xl p-6 md:p-8 backdrop-blur-sm transition-all">
                <div class="flex items-center gap-2 mb-4">
                    <span class="p-2 bg-rose-500/10 rounded-lg text-rose-400">
                        <i class="fa-solid fa-skull-crossbones text-2xl"></i>
                    </span>
                    <h2 class="font-display text-2xl font-bold tracking-wide text-rose-400 uppercase">
                        Acidentes
                    </h2>
                </div>

                <!-- Canvas da Roleta 2 -->
                <div class="wheel-container mb-6">
                    <div class="wheel-pointer"></div>
                    <canvas id="canvas-accidents" width="380" height="380" class="max-w-full h-auto cursor-pointer"></canvas>
                </div>

                <!-- Botão de Giro -->
                <button id="btn-spin-accidents" onclick="spinWheel('accidents')" class="glow-button-accidents w-full max-w-xs py-4 px-6 bg-gradient-to-r from-rose-600 to-rose-700 hover:from-rose-500 hover:to-rose-600 text-white font-display font-black text-lg tracking-wider uppercase rounded-xl transition-all transform hover:-translate-y-0.5 active:translate-y-0 flex items-center justify-center gap-2">
                    <i class="fa-solid fa-arrows-spin text-xl"></i> Girar Acidentes
                </button>

                <!-- Lista de Itens da Roleta -->
                <div class="w-full mt-8 border-t border-slate-800 pt-6">
                    <h3 class="text-xs font-semibold text-slate-400 uppercase tracking-wider mb-3">Opções da Roleta:</h3>
                    <ul id="list-accidents" class="space-y-2 text-sm text-slate-300">
                        <!-- Preenchido dinamicamente pelo JS -->
                    </ul>
                </div>
            </section>

        </div>
    </main>

    <!-- MODAL DE RESULTADO -->
    <div id="result-modal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-md z-50 flex items-center justify-center p-4 hidden opacity-0 transition-opacity duration-300">
        <div class="bg-slate-900 border border-slate-700 rounded-2xl max-w-md w-full p-6 text-center shadow-2xl transform scale-95 transition-transform duration-300 relative overflow-hidden" id="modal-card">
            
            <!-- Elemento decorativo de brilho de fundo -->
            <div id="modal-glow" class="absolute -top-24 -left-24 w-48 h-48 bg-amber-500/20 rounded-full blur-3xl pointer-events-none"></div>

            <div id="modal-icon-container" class="w-16 h-16 mx-auto mb-4 rounded-2xl flex items-center justify-center text-3xl shadow-inner">
                <i id="modal-icon" class="fa-solid fa-award"></i>
            </div>

            <h3 id="modal-category" class="font-display text-xs font-bold uppercase tracking-widest text-slate-400 mb-1">
                Categoria
            </h3>
            
            <h2 id="modal-title" class="text-xl md:text-2xl font-bold text-white mb-4">
                Título do Evento
            </h2>

            <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-4 mb-6">
                <p class="text-xs uppercase text-slate-500 font-semibold mb-1">Efeito / Consequência:</p>
                <p id="modal-reward" class="text-lg font-bold text-amber-400">
                    Recompensa ou Punição
                </p>
            </div>

            <button onclick="closeModal()" class="w-full py-3 px-6 bg-slate-800 hover:bg-slate-700 text-white font-semibold rounded-xl transition-colors border border-slate-700">
                Entendido!
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
